# nginxのserver block内へinclude。既存の同じlocationがあれば統合する。
# nginxへの直接アクセスでも内部ファイルを配信しない。
location ^~ /storage { return 404; }
location ^~ /backup { return 404; }
location ^~ /include { return 404; }
location ^~ /tests { return 404; }
location = /README.md { return 404; }
location = /nginx-security.conf { return 404; }
location ~ ^/Caddyfile { return 404; }

# PHPの汎用locationより前へ置く。
location ~ ^/scripts/.*\.(php|py)$ { return 404; }
location ~ (^|/)\.(?!well-known(?:/|$)) { return 404; }
location ~* \.(sqlite(?:-wal|-shm)?|db|sql|bak|old)(?:/|$) { return 404; }

# アップロード先ではPHPを実行しない。許可した媒体のみ静的に配信する。
location ^~ /image/uploads/ {
    if ($uri !~ "^/image/uploads/[a-f0-9]{32}\.(jpg|png|gif|webp|mp4|webm|mov)$") {
        return 404;
    }
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
